# Fertiges HA-Lovelace-Dashboard fuer das AI Gateway.
#
# Einfuegen: Einstellungen -> Dashboards -> Dashboard hinzufuegen ->
# "Neues Dashboard" -> oben rechts auf die drei Punkte -> "In YAML
# bearbeiten" -> Inhalt dieser Datei einfuegen.
#
# Nur die Kartenliste statt eines ganzen neuen Dashboards? Alles ab
# "cards:" (Einrueckung anpassen) in ein bestehendes Dashboard/View
# uebernehmen.
#
# sensor.ai_gateway_gemini_quota_pct existiert nur, wenn ein
# gemini_api_key konfiguriert ist. input_select.ai_gateway_provider_override
# entsprechend anpassen, falls provider_override_entity_id in den
# Add-on-Optionen umbenannt wurde.
#
# Fuer die Verlaufsgrafen unten (Zeitraum-Umschalter) einmalig einen
# Dropdown-Helfer anlegen: Einstellungen -> Geraete & Dienste -> Helfer ->
# Helfer hinzufuegen -> Dropdown. Entity-ID: input_select.ai_gateway_zeitraum
# (sonst die Entity-ID unten in allen "conditions:"-Bloecken anpassen).
# Optionen exakt so anlegen: "Heute", "Letzte 7 Tage", "Letzte 28 Tage".
# Alternativ per configuration.yaml:
#
#   input_select:
#     ai_gateway_zeitraum:
#       name: AI Gateway Zeitraum
#       icon: mdi:calendar-range
#       initial: "Letzte 7 Tage"
#       options:
#         - "Heute"
#         - "Letzte 7 Tage"
#         - "Letzte 28 Tage"
#
# Die history-graph-Karten unten listen alle vier Provider - Zeilen fuer
# nicht konfigurierte Provider (kein API-Key/keine ollama_url gesetzt)
# einfach entfernen, sonst zeigen sie "nicht verfuegbar".

title: AI Gateway
views:
  - title: AI Gateway
    path: ai-gateway
    icon: mdi:robot
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.ai_gateway_active_provider
            name: Aktiver Anbieter
            icon: mdi:robot-outline
          - entity: input_select.ai_gateway_provider_override
            name: Hart-Wechsel
          - type: attribute
            entity: sensor.ai_gateway_active_provider
            attribute: last_error
            name: Letzter Fehler
            icon: mdi:alert-circle-outline

      - type: gauge
        entity: sensor.ai_gateway_gemini_quota_pct
        name: Gemini-Kontingent heute
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 50
          red: 85

      - type: markdown
        title: Ausgefallene / gedrosselte Provider
        content: |
          {% set failed = state_attr('sensor.ai_gateway_active_provider', 'failed_providers') %}
          {% set cooldowns = state_attr('sensor.ai_gateway_active_provider', 'cooldowns') %}
          {% if failed %}
          **Zuletzt fehlgeschlagen:** {{ failed | join(', ') }}
          {% else %}
          ✅ Keine bekannten Ausfälle.
          {% endif %}

          {% if cooldowns %}
          **Aktuell auf Cooldown:**
          {% for provider, until in cooldowns.items() %}
          - {{ provider }}: bis {{ until }}
          {% endfor %}
          {% else %}
          ✅ Kein Provider aktuell gedrosselt.
          {% endif %}

      - type: entities
        title: Kennzahlen heute
        entities:
          - entity: sensor.ai_gateway_requests_today
            name: Anfragen heute
            icon: mdi:counter
          - entity: sensor.ai_gateway_tokens_today
            name: Tokens heute
            icon: mdi:counter
          - entity: sensor.ai_gateway_avg_latency_ms
            name: Ø Antwortzeit
            icon: mdi:timer-outline

      - type: markdown
        title: Anfragen nach Provider (heute)
        content: |
          {% set data = state_attr('sensor.ai_gateway_requests_today', 'by_provider') %}
          {% if data %}
          {% set total = data.values() | sum %}
          {% for provider, count in data.items() %}
          {{ provider }} — {{ count }}
          <div style="background: var(--divider-color); border-radius: 4px; margin: 2px 0 12px 0;">
            <div style="background: var(--primary-color); height: 10px; border-radius: 4px; width: {{ (count / total * 100) | round(1) if total else 0 }}%;"></div>
          </div>
          {% endfor %}
          {% else %}
          Noch keine Daten für heute.
          {% endif %}

      - type: entities
        title: Zeitraum für Verlaufsgrafen
        entities:
          - entity: input_select.ai_gateway_zeitraum
            name: Zeitraum

      - type: conditional
        conditions:
          - entity: input_select.ai_gateway_zeitraum
            state: "Heute"
        card:
          type: vertical-stack
          cards:
            - type: history-graph
              title: Anfragen pro Provider — Heute
              hours_to_show: 24
              entities:
                - sensor.ai_gateway_requests_today_gemini
                - sensor.ai_gateway_requests_today_groq
                - sensor.ai_gateway_requests_today_openrouter
                - sensor.ai_gateway_requests_today_ollama
            - type: history-graph
              title: Tokens pro Provider — Heute
              hours_to_show: 24
              entities:
                - sensor.ai_gateway_tokens_today_gemini
                - sensor.ai_gateway_tokens_today_groq
                - sensor.ai_gateway_tokens_today_openrouter
                - sensor.ai_gateway_tokens_today_ollama

      - type: conditional
        conditions:
          - entity: input_select.ai_gateway_zeitraum
            state: "Letzte 7 Tage"
        card:
          type: vertical-stack
          cards:
            - type: history-graph
              title: Anfragen pro Provider — Letzte 7 Tage
              hours_to_show: 168
              entities:
                - sensor.ai_gateway_requests_today_gemini
                - sensor.ai_gateway_requests_today_groq
                - sensor.ai_gateway_requests_today_openrouter
                - sensor.ai_gateway_requests_today_ollama
            - type: history-graph
              title: Tokens pro Provider — Letzte 7 Tage
              hours_to_show: 168
              entities:
                - sensor.ai_gateway_tokens_today_gemini
                - sensor.ai_gateway_tokens_today_groq
                - sensor.ai_gateway_tokens_today_openrouter
                - sensor.ai_gateway_tokens_today_ollama

      - type: conditional
        conditions:
          - entity: input_select.ai_gateway_zeitraum
            state: "Letzte 28 Tage"
        card:
          type: vertical-stack
          cards:
            - type: history-graph
              title: Anfragen pro Provider — Letzte 28 Tage
              hours_to_show: 672
              entities:
                - sensor.ai_gateway_requests_today_gemini
                - sensor.ai_gateway_requests_today_groq
                - sensor.ai_gateway_requests_today_openrouter
                - sensor.ai_gateway_requests_today_ollama
            - type: history-graph
              title: Tokens pro Provider — Letzte 28 Tage
              hours_to_show: 672
              entities:
                - sensor.ai_gateway_tokens_today_gemini
                - sensor.ai_gateway_tokens_today_groq
                - sensor.ai_gateway_tokens_today_openrouter
                - sensor.ai_gateway_tokens_today_ollama

      - type: entities
        title: Letzte Anfrage
        entities:
          - entity: sensor.ai_gateway_last_request
            name: Zeitpunkt
            icon: mdi:message-text-clock
          - type: attribute
            entity: sensor.ai_gateway_last_request
            attribute: provider
            name: Provider
          - type: attribute
            entity: sensor.ai_gateway_last_request
            attribute: trigger
            name: Anfrage
          - type: attribute
            entity: sensor.ai_gateway_last_request
            attribute: success
            name: Erfolgreich
          - type: attribute
            entity: sensor.ai_gateway_last_request
            attribute: latency_ms
            name: Antwortzeit
            suffix: " ms"
