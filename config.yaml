name: "AI Gateway"
description: "Kostenloser, kaskadierender Assist-Ersatz: Gemini/Groq/OpenRouter-Freikontingente mit automatischem Fallback auf lokales Ollama."
version: "0.5.10"
slug: "ai_gateway"
init: false

arch:
  - aarch64
  - amd64

startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager

ports:
  3000/tcp: 3001

ports_description:
  3000/tcp: "Grafana-Dashboard (nur falls enable_metrics aktiv ist)"

options:
  gemini_api_key: ""
  groq_api_key: ""
  openrouter_api_key: ""
  ollama_url: ""
  gateway_master_key: ""
  model_gemini: "gemini-2.0-flash"
  model_groq: "llama-3.3-70b-versatile"
  model_openrouter: "openai/gpt-oss-20b:free"
  model_ollama: "qwen2.5:7b"
  status_sensor_entity_id: "sensor.ai_gateway_active_provider"
  provider_override_entity_id: "input_select.ai_gateway_provider_override"
  enable_metrics: false
  grafana_admin_password: ""
  grafana_root_url: ""
  grafana_trusted_hostnames: ""

schema:
  gemini_api_key: password?
  groq_api_key: password?
  openrouter_api_key: password?
  ollama_url: str?
  gateway_master_key: password?
  model_gemini: str?
  model_groq: str?
  model_openrouter: str?
  model_ollama: str?
  status_sensor_entity_id: str?
  provider_override_entity_id: str?
  enable_metrics: bool?
  grafana_admin_password: password?
  grafana_root_url: str?
  grafana_trusted_hostnames: str?
